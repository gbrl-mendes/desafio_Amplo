name: docs

on:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install mkdocs-material
      - name: Preparar pasta de documentação
        run: |
          mkdir -p site-docs
                    cp README.md DOMINIO_E_CONTRATO.md DOCUMENTATION.md DECISOES_E_LIMITACOES.md COMO_BAIXAR.md RELATORIO_EXEMPLO.html extra.css site-docs/
      - run: mkdocs build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: /tmp/mkdocs-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
