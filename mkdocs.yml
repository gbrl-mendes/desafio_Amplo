site_name: Desafio Amplo — Gabriel Mendes
site_description: Curadoria taxonômica de sequências de eDNA, resposta ao desafio técnico da Amplo Engenharia
repo_url: https://github.com/gbrl-mendes/desafio_Amplo
repo_name: gbrl-mendes/desafio_Amplo

docs_dir: .
site_dir: /tmp/mkdocs-site
exclude_docs: |
  harness/
  r/
  tools/
  tests/
  data/
  runs/
  .venv/
  site/
  *.py
  *.R
  *.qmd
  *.csv
  *.json

theme:
  name: material
  language: pt-BR
  features:
    - navigation.tabs
    - navigation.top
    - search.suggest
    - content.code.copy

nav:
  - Início: README.md
  - Domínio e contrato: DOMINIO_E_CONTRATO.md
  - Documentação completa: DOCUMENTATION.md
  - Decisões e limitações: DECISOES_E_LIMITACOES.md
  - Como baixar: COMO_BAIXAR.md

markdown_extensions:
  - tables
  - fenced_code
  - toc:
      permalink: true
