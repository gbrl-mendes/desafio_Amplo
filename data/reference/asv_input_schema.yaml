# Contrato de schema da tabela de sequências de DNA (ASVs), pós-pipeline de bioinformática.
#
# Cada coluna cai em um de cinco papéis:
#
#   input             -> dado bruto ou metadado de amostra. É o que o sistema
#                        recebe como entrada e pode/deve usar.
#
#   derived_local     -> não vem no CSV bruto do BLASTr, mas é recomputada
#                        localmente, sempre, a partir de colunas `input`, no
#                        bloco de setup/parsing do curadoria_deterministica.R
#                        (tamanho de sequência, soma de abundância). Não é
#                        exigida na entrada e não é tratada como vazamento se
#                        vier presente: é só um dado estrutural simples, não
#                        um julgamento de curadoria.
#
#   derived_recompute -> coluna que outro pipeline, de outro projeto, já
#                        calculou antes com fórmula diferente da nossa
#                        (pseudo-score, contaminação, taxonomia completa). Se
#                        aparecer no arquivo de entrada, é sinal de que
#                        alguém está entregando uma tabela já enriquecida em
#                        vez da tabela bruta esperada. A validação recusa a
#                        execução nesse caso: o sistema deve calcular sua
#                        própria versão a partir das colunas `input`, nunca
#                        copiar um valor pronto.
#
#   gabarito          -> decisão humana de curadoria (Curated ID / Obs.
#                        Curadoria). Nunca fica no input; a comparação com
#                        esse gabarito é feita fora deste repositório.
#
#   out_of_scope      -> fora do escopo do sistema por decisão explícita
#
# A tabela de input é long-format: uma linha por combinação de sequência (ASV)
# e amostra, não uma linha por sequência única. A mesma sequência aparece em
# várias amostras diferentes, então a chave primária é composta.
primary_key: ["ASV (Sequence)", "Unique_File_name"]

columns:
  # --- Identificação de projeto / amostra (metadado) ---
  - {name: "Researcher", role: input, required: true}
  - {name: "Project", role: input, required: true}
  - {name: "Primer", role: input, required: true}
  - {name: "Sample", role: input, required: true}
  - {name: "Unique_File_name", role: input, required: true}
  - {name: "obs", role: input, required: false}
  - {name: "Type", role: input, required: true}

  # --- Abundância (estatísticas básicas pós-DADA2, não são julgamento de curadoria) ---
  - {name: "Total clean sample abd.", role: input, required: false}
  - {name: "Clean relative abd. on sample", role: input, required: false}
  - {name: "Relative abundance to all samples", role: input, required: false}
  - {name: "Relative abundance on sample", role: input, required: false}
  - {name: "ASV absolute abundance", role: input, required: true}
  - {name: "ASV clean abs. abd.", role: input, required: false}

  # --- Ponto amostral: obrigatorio como conceito (Ponto), nao como nome bruto.
  # No dataset de demonstracao chega como "Metadata 1" e e traduzido para
  # "Ponto" por colunas_alias (aplicado antes desta checagem) -- outro projeto
  # pode ja trazer uma coluna chamada "Ponto" diretamente, sem alias nenhum.
  - {name: "Ponto", role: input, required: true}

  # --- Metadados de amostra (Metadata 1-12: automaticamente extraídos do nome da amostra) ---
  # Todos opcionais individualmente. Por padrão (colunas_alias), Metadata 8/9
  # viram Latitude/Longitude (checagem regional GBIF) e Metadata 10/11 viram
  # Habitat/Rios -- guardados como metadado bruto hoje, sem cálculo próprio
  # ainda, pra alimentar uma futura etapa de análise ecológica (fora do
  # escopo desta entrega, ver DOMINIO_E_CONTRATO.md). A ausência de qualquer
  # um desses (inclusive Latitude/Longitude) degrada graciosamente: a
  # checagem regional é pulada com aviso, Habitat/Rios ficam vazios na
  # evidência da curadoria assistida, nada quebra.
  - {name: "Metadata 1", role: input, required: false}
  - {name: "Metadata 2", role: input, required: false}
  - {name: "Metadata 3", role: input, required: false}
  - {name: "Metadata 4", role: input, required: false}
  - {name: "Metadata 5", role: input, required: false}
  - {name: "Metadata 6", role: input, required: false}
  - {name: "Metadata 7", role: input, required: false}
  - {name: "Metadata 8", role: input, required: false}
  - {name: "Metadata 9", role: input, required: false}
  - {name: "Metadata 10", role: input, required: false}
  - {name: "Metadata 11", role: input, required: false}
  - {name: "Metadata 12", role: input, required: false}

  # --- ASV: identificadores e tamanho bruto ---
  - {name: "ASV (Sequence)", role: input, required: true}
  - {name: "Sequence (ASV tip)", role: input, required: false}

  # --- Controles de contaminacao ---
  - {name: "Ext. Control", role: input, required: false}
  - {name: "PCR Control", role: input, required: false}
  - {name: "Filt. Control", role: input, required: false}

  # --- Hits brutos de BLAST ---
  - {name: "1_subject header", role: input, required: true}
  - {name: "1_staxid", role: input, required: true}
  - {name: "1_subject", role: input, required: true}
  - {name: "1_indentity", role: input, required: true}
  - {name: "1_qcovhsp", role: input, required: true}
  - {name: "1_length", role: input, required: false}
  - {name: "1_mismatches", role: input, required: false}
  - {name: "1_gaps", role: input, required: false}
  - {name: "1_query start", role: input, required: false}
  - {name: "1_query end", role: input, required: false}
  - {name: "1_subject start", role: input, required: false}
  - {name: "1_subject end", role: input, required: false}
  - {name: "1_e-value", role: input, required: false}
  - {name: "1_bitscore", role: input, required: false}
  - {name: "2_subject header", role: input, required: true}
  - {name: "2_staxid", role: input, required: true}
  - {name: "2_subject", role: input, required: true}
  - {name: "2_indentity", role: input, required: true}
  - {name: "2_qcovhsp", role: input, required: true}
  - {name: "2_length", role: input, required: false}
  - {name: "2_mismatches", role: input, required: false}
  - {name: "2_gaps", role: input, required: false}
  - {name: "2_query start", role: input, required: false}
  - {name: "2_query end", role: input, required: false}
  - {name: "2_subject start", role: input, required: false}
  - {name: "2_subject end", role: input, required: false}
  - {name: "2_e-value", role: input, required: false}
  - {name: "2_bitscore", role: input, required: false}
  - {name: "3_subject header", role: input, required: true}
  - {name: "3_staxid", role: input, required: true}
  - {name: "3_subject", role: input, required: true}
  - {name: "3_indentity", role: input, required: true}
  - {name: "3_qcovhsp", role: input, required: true}
  - {name: "3_length", role: input, required: false}
  - {name: "3_mismatches", role: input, required: false}
  - {name: "3_gaps", role: input, required: false}
  - {name: "3_query start", role: input, required: false}
  - {name: "3_query end", role: input, required: false}
  - {name: "3_subject start", role: input, required: false}
  - {name: "3_subject end", role: input, required: false}
  - {name: "3_e-value", role: input, required: false}
  - {name: "3_bitscore", role: input, required: false}

  # --- Gabarito, excluído do input da LLM ---
  - {name: "Curated ID", role: gabarito}
  - {name: "Obs. Curadoria", role: gabarito}

  # --- Fora de escopo ---
  - {name: "OTU", role: out_of_scope}

# Colunas cujo valor pode conter múltiplos controles separados por ";" numa
# única célula, bug real documentado no pipeline de referência, que quebra a
# suposição de "um controle por categoria" num cruzamento simples. A tool de
# validação deve sinalizar isso explicitamente em vez de deixar passar
# silenciosamente.
multi_value_control_columns:
  - "Ext. Control"
  - "PCR Control"
  - "Filt. Control"
